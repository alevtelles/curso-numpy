[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imagens"
version = "0.1.0"
description = "Processamento de imagens só com NumPy (projeto da parte Intermediário)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
imagens = "imagens.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
